name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: SKILL.md vs quire CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install quire CLI
        run: npm install -g @quire-io/quire-cli

      - name: Run validate.sh
        run: bash .github/scripts/validate.sh
